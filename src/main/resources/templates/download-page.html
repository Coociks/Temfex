<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать файл — Temfex</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .file-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .file-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
            word-break: break-all;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .file-info {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .info-value {
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        .download-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        .password-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .password-input:focus {
            border-color: var(--primary);
        }

        .footer {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Temfex </h1>
        
        <div class="file-icon">📄</div>
        <div class="file-name" th:text="${originalName}">имя_файла.mp3</div>
        
        <div class="file-info">
            <div class="info-row">
                <span class="info-label">Размер</span>
                <span class="info-value" th:text="${size}">0 МБ</span>
            </div>
            <div class="info-row">
                <span class="info-label">Тип</span>
                <span class="info-value" th:text="${mimeType}">application/octet-stream</span>
            </div>
        </div>

        <div th:if="${passwordRequired}" style="margin-bottom: 20px;">
            <input type="password" class="password-input" id="password" placeholder="Введите пароль для скачивания">
        </div>

        <div style="margin-bottom: 20px;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="shareLink" readonly 
                    style="flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #f1f5f9;"
                    th:value="${'http://localhost:8080/s/' + shortId}">
                <button id="copyBtn" style="padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                    📋 Копировать
                </button>
            </div>
        </div>

        <!-- Кнопка скачивания с data-атрибутом для надёжной передачи shortId -->
        <button class="download-btn" id="downloadBtn" th:data-shortid="${shortId}">
            ⬇️ Скачать файл
        </button>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">📱 Отсканируйте QR-код для открытия на телефоне</p>
            <img th:src="@{'/s/' + ${shortId} + '/qr'}" alt="QR-код" style="border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: white;">
            <div style="margin-top: 15px;">
                <a th:href="@{'/s/' + ${shortId} + '/qr'}" download="qrcode.png" 
                style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600;">
                    ⬇️ Скачать QR-код
                </a>
            </div>
        </div>

        <div class="footer">
            Файл будет автоматически удалён после истечения срока или лимита скачиваний
        </div</div>
    </div>

    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const shortId = downloadBtn.dataset.shortid;

        downloadBtn.addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const password = passwordInput ? passwordInput.value : '';
            
            let url = `/s/${shortId}/download`;
            if (password) {
                url += `?password=${encodeURIComponent(password)}`;
            }
            
            // Меняем текст кнопки для обратной связи
            downloadBtn.textContent = '⏳ Подготовка...';
            downloadBtn.disabled = true;
            
            // Перенаправляем на скачивание
            window.location.href = url;
            
            // Возвращаем кнопку в исходное состояние через 2 секунды (если скачивание не началось)
            setTimeout(() => {
                downloadBtn.textContent = '⬇️ Скачать файл';
                downloadBtn.disabled = false;
            }, 2000);
        });
    </script>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
        
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => {
                btn.textContent = '📋 Копировать';
            }, 2000);
        });
    </script>

</body>
</html>
