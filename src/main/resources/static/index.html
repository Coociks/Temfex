<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temfex - Временный файлообменник</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        .drop-zone p {
            margin: 0;
            color: var(--text-muted);
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        select, input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .link-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .link-box input {
            flex: 1;
            background: white;
        }

        .copy-btn {
            width: auto;
            padding: 10px 20px;
            background: var(--success);
        }
        
        .copy-btn:hover { background: #059669; }

        .status {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Temfex </h1>
    
    <div class="drop-zone" id="dropZone">
        <p>Перетащите файлы сюда или кликните для выбора</p>
    </div>
    <input type="file" id="fileInput" multiple>

    <div class="settings">
        <div class="setting-group">
            <label>Срок жизни</label>
            <select id="ttl">
                <option value="PT1H">1 час</option>
                <option value="PT24H" selected>24 часа</option>
                <option value="P7D">7 дней</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Макс. скачиваний</label>
            <input type="number" id="maxDownloads" value="5" min="1" max="100">
        </div>
    </div>

    <button id="uploadBtn" disabled>Загрузить и получить ссылку</button>
    
    <div class="status" id="status"></div>

    <div class="result" id="result">
        <label>Ваша ссылка готова:</label>
        <div class="link-box">
            <input type="text" id="shareLink" readonly>
            <button class="copy-btn" id="copyBtn">Копировать</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const shareLinkInput = document.getElementById('shareLink');
    const copyBtn = document.getElementById('copyBtn');

    let selectedFiles = [];

    // Drag & Drop логика
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFiles(e.dataTransfer.files);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFiles(e.target.files);
        }
    });

    function handleFiles(fileList) {
        selectedFiles = Array.from(fileList);
        
        if (selectedFiles.length === 1) {
            const file = selectedFiles[0];
            dropZone.querySelector('p').textContent = `Выбран файл: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        } else {
            const totalSize = selectedFiles.reduce((acc, file) => acc + file.size, 0);
            dropZone.querySelector('p').textContent = `Выбрано файлов: ${selectedFiles.length} (Общий размер: ${(totalSize / 1024).toFixed(1)} KB)`;
        }
        
        uploadBtn.disabled = false;
        resultDiv.classList.remove('show');
    }

    // Загрузка файлов
    uploadBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0) return;

        uploadBtn.disabled = true;
        statusDiv.textContent = '⏳ Загрузка файлов...';
        resultDiv.classList.remove('show');

        try {
            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file); // Важно: ключ 'files' (множественное число)
            });

            const uploadRes = await fetch('/api/files/upload', {
                method: 'POST',
                body: formData
            });

            if (!uploadRes.ok) {
                const error = await uploadRes.json();
                throw new Error(error.message || 'Ошибка загрузки');
            }

            const uploadData = await uploadRes.json();
            statusDiv.textContent = '⏳ Создание ссылки...';

            // Создаем ссылку
            const linkRes = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fileId: uploadData.fileId,
                    ttl: document.getElementById('ttl').value,
                    maxDownloads: parseInt(document.getElementById('maxDownloads').value)
                })
            });

            if (!linkRes.ok) {
                const error = await linkRes.json();
                throw new Error(error.message || 'Ошибка создания ссылки');
            }

            const linkData = await linkRes.json();

            // Показываем результат
            const fullUrl = `${window.location.origin}${linkData.downloadUrl}`;
            shareLinkInput.value = fullUrl;
            resultDiv.classList.add('show');
            statusDiv.textContent = '✅ Готово!';
            statusDiv.style.color = 'var(--success)';

        } catch (error) {
            statusDiv.textContent = `❌ Ошибка: ${error.message}`;
            statusDiv.style.color = '#ef4444';
            uploadBtn.disabled = false;
        }
    });

    // Копирование ссылки
    copyBtn.addEventListener('click', () => {
        shareLinkInput.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Скопировано!';
        setTimeout(() => copyBtn.textContent = 'Копировать', 2000);
    });
</script>

</body>
</html>
