version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: temfex-postgres
    environment:
      POSTGRES_DB: temfex
      POSTGRES_USER: temfex
      POSTGRES_PASSWORD: temfex_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: temfex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
